name: Something went Meowth
description: Report a game or desktop-app bug.
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: Game version
      placeholder: '1.1.3'
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Where are you playing?
      options:
        - Windows portable app
        - Windows installer
        - Local browser build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the region, shop or scene and the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: textarea
    id: pictures
    attributes:
      label: Screenshots or extra details
      description: Leave personal save files and private information out of the report.
